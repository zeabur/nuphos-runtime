name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    name: Runtime adapters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test session configuration and credential persistence
        run: node --test test/codex-runtime.test.mjs test/codex-login.test.mjs test/runtime-defaults.test.mjs test/runtime-credentials.test.mjs
      - name: Install the pinned Codex ACP adapter
        run: npm ci --ignore-scripts --prefix image/codex-acp
      - name: Exercise the patched adapter against a Codex App Server fixture
        run: node test/codex-acp-smoke.mjs image/codex-acp/node_modules/@agentclientprotocol/codex-acp/dist/index.js
      - name: Steer an active turn through the patched adapter
        run: node --test test/codex-steering.test.mjs test/codex-steering-smoke.mjs
      - name: Verify environment isolation in a real Codex shell
        run: node test/codex-shell-env-smoke.mjs image/codex-acp/node_modules/.bin/codex
      - name: Verify the pinned Claude adapter patch
        run: |
          npm ci --ignore-scripts --prefix image/claude-agent-acp
          node image/claude-agent-acp/patch-adapter.mjs image/claude-agent-acp/node_modules/@agentclientprotocol/claude-agent-acp/dist/acp-agent.js
          node --check image/claude-agent-acp/node_modules/@agentclientprotocol/claude-agent-acp/dist/acp-agent.js
          node --test test/claude-turn-completion-smoke.mjs

  image:
    name: Image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the Codex provider base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: third_party/openab
          file: third_party/openab/Dockerfile.unified
          target: codex
          load: true
          tags: openab-codex-base:ci
          build-args: OPENAB_BUILD_SHA=ci
      - name: Build the toolset layer on it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          file: image/Dockerfile
          load: true
          tags: nuphos-runtime-codex:ci
          build-args: |
            BASE_IMAGE=openab-codex-base:ci
            RUNTIME_PROVIDER=codex
