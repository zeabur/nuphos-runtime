name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    name: Runtime adapters
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the image's helpers, defaults and release gate
        run: npm test
      - name: Install the pinned Codex ACP adapter
        run: npm ci --ignore-scripts --prefix image/codex-acp
      - name: Exercise the patched adapter against a Codex App Server fixture
        run: node test/codex-acp-smoke.mjs image/codex-acp/node_modules/@agentclientprotocol/codex-acp/dist/index.js
      - name: Steer an active turn through the patched adapter
        run: node --test test/codex-steering.test.mjs test/codex-steering-smoke.mjs
      - name: Verify environment isolation in a real Codex shell
        run: node test/codex-shell-env-smoke.mjs image/codex-acp/node_modules/.bin/codex
      - name: Verify the pinned Claude adapter patch
        run: |
          npm ci --ignore-scripts --prefix image/claude-agent-acp
          node image/claude-agent-acp/patch-adapter.mjs image/claude-agent-acp/node_modules/@agentclientprotocol/claude-agent-acp/dist/acp-agent.js
          node --check image/claude-agent-acp/node_modules/@agentclientprotocol/claude-agent-acp/dist/acp-agent.js
          node --test test/claude-turn-completion-smoke.mjs

  image:
    name: Toolset layer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # The provider base is a Rust build of the openab gateway and takes far
      # longer than everything else here. What this repository owns is the
      # layer on top, which builds the same way on any node:22-trixie-slim
      # base, so PR CI uses that and build.yml builds the real pair.
      - name: Build the toolset layer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: image
          file: image/Dockerfile
          build-args: |
            BASE_IMAGE=node:22-trixie-slim
            RUNTIME_PROVIDER=codex
          cache-from: type=gha,scope=toolset-codex
          cache-to: type=gha,mode=max,scope=toolset-codex
